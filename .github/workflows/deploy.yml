name: CD (déploiement VPS)

# Déploie la branche stable `preview` sur la VPS (production). `main` suit le
# dépôt WPPConnect d'origine et n'est jamais déployée.
#
# Déclenché par un push sur `preview` (ou à la main depuis l'onglet Actions),
# PAS par `workflow_run` : un workflow `workflow_run` n'est lu que depuis la
# branche par défaut du repo (`main`, celle de l'upstream), qui ne contient
# pas ce fichier — il ne se serait donc jamais déclenché. Le build + lint
# sont refaits ici avant le déploiement (job `verify`) pour ne jamais
# déployer du code qui ne compile pas, sans modifier build.yml (fichier de
# l'upstream, on évite les conflits à la synchronisation).
on:
  push:
    branches: [preview]
  workflow_dispatch:

# Un seul déploiement à la fois ; un nouveau push attend la fin du précédent.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

# Enchaînement : verify (build + lint) → build-images (image linux/arm64
# construite par GitHub Actions et publiée sur GHCR) → deploy (la VPS ne fait
# plus que TÉLÉCHARGER l'image : plus aucune compilation sur ses 2 cœurs,
# partagés avec dayaxcash-monorepo et Tailowl). Les étapes exécutées sur la
# VPS sont dans deploy/vps-deploy.sh (clé SSH restreinte, voir le job deploy).
#
# Chaque job est limité à `preview` : un workflow_dispatch lancé par erreur
# depuis une autre branche ne publie jamais d'image `latest` et ne déploie
# rien (deploy/vps-deploy.sh refuserait de toute façon un commit absent de
# l'historique de preview, mais seulement après la publication de l'image).
env:
  # GHCR refuse les majuscules : le propriétaire "YACIN-DEV-100" est écrit
  # en minuscules en dur ici.
  IMAGE: ghcr.io/yacin-dev-100/wppconnect-server/wppconnect
  # Commit déployé (push sur preview ou workflow_dispatch sur preview).
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  verify:
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.22.2

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Yarn
        run: corepack prepare yarn@4.14.1 --activate

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build source
        run: yarn build

      - name: Lint source
        run: yarn lint

  build-images:
    needs: verify
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Le repo est privé : les runners ARM natifs gratuits (ubuntu-24.04-arm)
      # sont réservés aux repos publics, d'où l'émulation QEMU sur un runner
      # x86. Plus lent qu'en natif, compensé par le cache (type=gha).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile d'origine WPPConnect, inchangé (node:alpine + paquet Alpine
      # `chromium`, disponible en aarch64).
      - name: Construire et publier wppconnect (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=wppconnect
          cache-to: type=gha,mode=max,scope=wppconnect

  deploy:
    needs: build-images
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    steps:
      # Secrets à créer une fois dans Settings > Secrets and variables >
      # Actions DE CE REPO (indépendant de dayaxcash-monorepo — les secrets
      # GitHub Actions sont scoppés par repo) :
      #   VPS_HOST : IP publique de la VPS (ex: DAYAX sur Oracle Cloud)
      #   VPS_USER : utilisateur SSH dédié au déploiement (PAS root)
      #   VPS_SSH_KEY : clé privée de CE compte de déploiement (jamais la
      #     clé personnelle utilisée pour créer la VM)
      # La VPS doit déjà être connectée à ghcr.io (`docker login ghcr.io` fait
      # une fois par l'utilisateur de déploiement, jeton read:packages,
      # partagé avec dayaxcash-monorepo et Tailowl) — aucun jeton n'est
      # stocké dans ce repo.
      - name: Déployer sur la VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # CLÉ RESTREINTE (`wpp-ci`) : côté VPS, sa clé publique porte
          # `command="/home/deploy/bin/wpp-deploy.sh",no-port-forwarding,...`
          # dans ~/.ssh/authorized_keys du compte deploy. Le VPS exécute donc
          # TOUJOURS ce script, jamais ce `script:` : on n'y envoie que le
          # commit à déployer, que le script lit dans SSH_ORIGINAL_COMMAND.
          # Les étapes (réseau, code au commit déployé, pull de l'image taguée
          # par SHA, up -d, nettoyage) sont dans deploy/vps-deploy.sh, installé
          # sur le VPS dans ~/bin/wpp-deploy.sh. Pour changer une étape :
          # modifier deploy/vps-deploy.sh puis réinstaller la copie (voir
          # CLAUDE.md) — ajouter des commandes ici n'aurait aucun effet.
          script: DEPLOY_SHA=${{ env.DEPLOY_SHA }}
