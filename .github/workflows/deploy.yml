name: CD (déploiement VPS)

# Déploie la branche stable `preview` sur la VPS (production). `main` suit le
# dépôt WPPConnect d'origine et n'est jamais déployée.
#
# Déclenché par un push sur `preview` (ou à la main depuis l'onglet Actions),
# PAS par `workflow_run` : un workflow `workflow_run` n'est lu que depuis la
# branche par défaut du repo (`main`, celle de l'upstream), qui ne contient
# pas ce fichier — il ne se serait donc jamais déclenché. Le build + lint
# sont refaits ici avant le déploiement (job `verify`) pour ne jamais
# déployer du code qui ne compile pas, sans modifier build.yml (fichier de
# l'upstream, on évite les conflits à la synchronisation).
on:
  push:
    branches: [preview]
  workflow_dispatch:

# Un seul déploiement à la fois ; un nouveau push attend la fin du précédent.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.22.2

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Yarn
        run: corepack prepare yarn@4.14.1 --activate

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build source
        run: yarn build

      - name: Lint source
        run: yarn lint

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Secrets à créer une fois dans Settings > Secrets and variables >
      # Actions DE CE REPO (indépendant de dayaxcash-monorepo — les secrets
      # GitHub Actions sont scoppés par repo) :
      #   VPS_HOST : IP publique de la VPS (ex: DAYAX sur Oracle Cloud)
      #   VPS_USER : utilisateur SSH dédié au déploiement (PAS root)
      #   VPS_SSH_KEY : clé privée de CE compte de déploiement (jamais la
      #     clé personnelle utilisée pour créer la VM)
      - name: Déployer sur la VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            docker network create dayaxcash_net 2>/dev/null || true
            cd ~/wppconnect-server
            git fetch origin preview
            git checkout -f -B preview origin/preview
            docker compose build
            docker compose up -d
            docker image prune -f
